<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>MotoRuta Argentina - Selector Exacto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-main: #0b1120;
      --bg-surface: #1e293b;
      --bg-card: #182234;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --warning: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-main);
      color: #f8fafc;
    }

    #sidebar {
      width: 440px;
      min-width: 360px;
      height: 100%;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      z-index: 1000;
      transition: transform 0.3s ease;
    }

    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #0f172a;
    }

    .leaflet-tile-pane {
      filter: brightness(0.88) contrast(1.15) saturate(0.9);
    }

    .header {
      padding: 14px 16px;
      background: var(--bg-main);
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header p {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .drawer {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }

    .panel-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .panel-title {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .inputs-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .inputs-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .form-group label {
      font-size: 0.68rem;
      color: #94a3b8;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      color: white;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group select {
      cursor: pointer;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
    }

    .btn-calc {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-calc:hover { background: #0369a1; }

    .summary-badge-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .badge-info {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 4px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid var(--border);
    }
    .badge-info strong { color: var(--accent); }

    .day-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      position: relative;
    }
    .day-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .day-card.active {
      border-color: var(--accent);
      background: #1c2e4a;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35);
    }
    .day-card.caution-card {
      border-color: var(--warning) !important;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .day-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #93c5fd;
    }
    .day-km-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: #064e3b;
      color: #6ee7b7;
    }
    .day-km-tag.warn {
      background: #78350f;
      color: #fde68a;
    }

    .stop-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 6px 0;
    }
    .chip-stop {
      font-size: 0.65rem;
      background: #0b1120;
      border: 1px solid #334155;
      padding: 2px 5px;
      border-radius: 4px;
      color: #cbd5e1;
    }
    .chip-stop.fuel {
      border-color: #f59e0b;
      color: #fbbf24;
    }

    .custom-icon {
      border: 2px solid white;
      border-radius: 50%;
      color: white;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      font-weight: bold;
    }
    .marker-origin { background: #10b981; line-height: 24px; font-size: 12px; }
    .marker-dest { background: #ef4444; line-height: 24px; font-size: 12px; }
    .marker-rest { background: #0d9488; line-height: 20px; font-size: 10px; }

    .mobile-tab-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: #0b1120;
      border-top: 1px solid var(--border);
      z-index: 2000;
      grid-template-columns: 1fr 1fr;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
    }
    .tab-btn.active {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .mobile-tab-bar { display: grid; }
      #sidebar {
        width: 100%;
        min-width: 100%;
        height: calc(100dvh - 52px);
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1500;
        border-right: none;
      }
      #sidebar.hidden-mobile {
        transform: translateY(100%);
        pointer-events: none;
      }
      #map-container {
        height: calc(100dvh - 52px);
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="header">
      <h1>🏍️ MotoRuta Argentina</h1>
      <p>Selección Exacta de Rutas, Autonomía y Etapas</p>
    </div>

    <div class="drawer">
      <!-- 1. Desplegables de Ciudades Fijas -->
      <div class="panel-box">
        <div class="panel-title">📍 Origen y Destino (Argentina)</div>
        <div class="inputs-grid-2">
          <div class="form-group">
            <label>Ciudad de Origen</label>
            <select id="selectOrigin"></select>
          </div>
          <div class="form-group">
            <label>Ciudad de Destino</label>
            <select id="selectDest"></select>
          </div>
        </div>
      </div>

      <!-- 2. Especificaciones de la Moto -->
      <div class="panel-box">
        <div class="panel-title">⚙️ Datos de la Moto</div>
        <div class="inputs-grid-2" style="margin-bottom: 8px;">
          <div class="form-group">
            <label>Cilindrada (cc)</label>
            <input type="number" id="inputCc" value="450" min="50" max="1800" oninput="autoEstimateSpecs()" />
          </div>
          <div class="form-group">
            <label>Potencia (HP)</label>
            <input type="number" id="inputHp" value="40" min="5" max="220" />
          </div>
        </div>
        <div class="inputs-grid-3">
          <div class="form-group">
            <label>Tanque (L)</label>
            <input type="number" id="inputTank" value="17" step="0.5" oninput="calculateAutonomy()" />
          </div>
          <div class="form-group">
            <label>Consumo (km/L)</label>
            <input type="number" id="inputKmL" value="23" step="0.5" oninput="calculateAutonomy()" />
          </div>
          <div class="form-group">
            <label>Max km / Día</label>
            <input type="number" id="inputMaxKmDay" value="450" step="50" />
          </div>
        </div>

        <div class="summary-badge-bar">
          <span class="badge-info">Autonomía segura: <strong id="valAutonomy">~351 km</strong></span>
          <span class="badge-info">Crucero sugerido: <strong id="valCruise">~105 km/h</strong></span>
        </div>

        <button class="btn-calc" onclick="planTrip()">
          🚀 Trazar Ruta Exacta
        </button>
      </div>

      <!-- 3. Panel de Resultados -->
      <div id="resultsPanel" style="display: none; flex-direction: column; gap: 8px;">
        <div class="panel-title" style="padding: 0 4px;">
          <span>📋 Itinerario Calculado</span>
          <span id="tripTotals" style="color: #94a3b8; font-weight: normal; font-size: 0.7rem;"></span>
        </div>
        <div id="stagesList" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>
    </div>
  </div>

  <div id="map-container">
    <div id="map"></div>
  </div>

  <div class="mobile-tab-bar">
    <button class="tab-btn" id="tabMapBtn" onclick="switchMobileView('map')">🗺️ Ver Mapa</button>
    <button class="tab-btn active" id="tabListBtn" onclick="switchMobileView('list')">⚙️ Planificador</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Base de datos de ciudades de Argentina con coordenadas exactas verificadas
    const ARGENTINA_CITIES = [
      { name: "Buenos Aires (CABA)", lat: -34.6037, lng: -58.3816 },
      { name: "Mar del Plata (BA)", lat: -38.0055, lng: -57.5560 },
      { name: "Bahía Blanca (BA)", lat: -38.7196, lng: -62.2724 },
      { name: "Olavarría (BA)", lat: -36.8927, lng: -60.3225 },
      { name: "Tandil (BA)", lat: -37.3217, lng: -59.1332 },
      { name: "San Carlos de Bariloche (RN)", lat: -41.1335, lng: -71.3103 },
      { name: "Las Grutas (RN)", lat: -40.8094, lng: -65.0931 },
      { name: "Viedma (RN)", lat: -40.8135, lng: -62.9967 },
      { name: "San Martín de los Andes (NQN)", lat: -40.1579, lng: -71.3533 },
      { name: "Villa La Angostura (NQN)", lat: -40.7634, lng: -71.6433 },
      { name: "Neuquén Capital (NQN)", lat: -38.9516, lng: -68.0591 },
      { name: "Santa Rosa (LP)", lat: -36.6204, lng: -64.2906 },
      { name: "General Acha (LP)", lat: -37.3770, lng: -64.6043 },
      { name: "25 de Mayo (LP)", lat: -37.7719, lng: -67.7161 },
      { name: "Córdoba Capital (CBA)", lat: -31.4201, lng: -64.1888 },
      { name: "Villa Carlos Paz (CBA)", lat: -31.4241, lng: -64.4978 },
      { name: "Mina Clavero (CBA)", lat: -31.7247, lng: -65.0028 },
      { name: "Mendoza Capital (MDZ)", lat: -32.8895, lng: -68.8458 },
      { name: "San Rafael (MDZ)", lat: -34.6177, lng: -68.3301 },
      { name: "Malargüe (MDZ)", lat: -35.4754, lng: -69.5843 },
      { name: "Rosario (SF)", lat: -32.9468, lng: -60.6393 },
      { name: "Santa Fe Capital (SF)", lat: -31.6333, lng: -60.7000 },
      { name: "San Juan Capital (SJ)", lat: -31.5375, lng: -68.5364 },
      { name: "San Luis Capital (SL)", lat: -33.2950, lng: -66.3356 },
      { name: "Merlo (SL)", lat: -32.3433, lng: -65.0125 },
      { name: "Salta Capital (SLA)", lat: -24.7821, lng: -65.4232 },
      { name: "Cafayate (SLA)", lat: -26.0731, lng: -65.9761 },
      { name: "San Salvador de Jujuy (JUY)", lat: -24.1858, lng: -65.2995 },
      { name: "Purmamarca (JUY)", lat: -23.7461, lng: -65.4989 },
      { name: "San Miguel de Tucumán (TUC)", lat: -26.8083, lng: -65.2176 },
      { name: "Tafí del Valle (TUC)", lat: -26.8528, lng: -65.7100 },
      { name: "Puerto Madryn (CHU)", lat: -42.7692, lng: -65.0385 },
      { name: "Esquel (CHU)", lat: -42.9115, lng: -71.3195 },
      { name: "El Calafate (SC)", lat: -50.3379, lng: -72.2648 },
      { name: "El Chaltén (SC)", lat: -49.3315, lng: -72.8864 },
      { name: "Ushuaia (TDF)", lat: -54.8019, lng: -68.3030 }
    ];

    // Cargar opciones en los selectores
    function populateCitySelectors() {
      const selectO = document.getElementById('selectOrigin');
      const selectD = document.getElementById('selectDest');

      selectO.innerHTML = '';
      selectD.innerHTML = '';

      ARGENTINA_CITIES.forEach((city, index) => {
        const optO = document.createElement('option');
        optO.value = index;
        optO.textContent = city.name;
        selectO.appendChild(optO);

        const optD = document.createElement('option');
        optD.value = index;
        optD.textContent = city.name;
        selectD.appendChild(optD);
      });

      // Valores iniciales: Buenos Aires -> Bariloche
      selectO.value = 0; // Buenos Aires
      selectD.value = 5; // Bariloche
    }

    // Inicializar Mapa centrado estrictamente en Argentina
    const map = L.map('map', { zoomControl: false }).setView([-38.4161, -63.6167], 5);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Relieve Topográfico 3D
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri, USGS',
      maxZoom: 18
    }).addTo(map);

    let routeLayer = null;
    let markersLayer = L.layerGroup().addTo(map);

    function autoEstimateSpecs() {
      const cc = parseInt(document.getElementById('inputCc').value) || 300;
      let hp = 25;
      let kml = 26;
      let cruise = 95;

      if (cc <= 160) { hp = 14; kml = 35; cruise = 85; }
      else if (cc <= 250) { hp = 24; kml = 29; cruise = 95; }
      else if (cc <= 450) { hp = 40; kml = 23; cruise = 105; }
      else if (cc <= 700) { hp = 70; kml = 19; cruise = 115; }
      else if (cc <= 900) { hp = 95; kml = 17; cruise = 125; }
      else { hp = 125; kml = 15; cruise = 130; }

      document.getElementById('inputHp').value = hp;
      document.getElementById('inputKmL').value = kml;
      calculateAutonomy();
    }

    function calculateAutonomy() {
      const tank = parseFloat(document.getElementById('inputTank').value) || 15;
      const kml = parseFloat(document.getElementById('inputKmL').value) || 20;
      const safeKm = Math.round((tank * kml) * 0.90);
      
      const cc = parseInt(document.getElementById('inputCc').value) || 300;
      let cruise = cc > 400 ? 110 : (cc > 200 ? 100 : 85);

      document.getElementById('valAutonomy').innerText = `~${safeKm} km`;
      document.getElementById('valCruise').innerText = `~${cruise} km/h`;
      return safeKm;
    }

    // Trazado de ruta vía OSRM con coordenadas exactas [lng, lat]
    async function getRoute(origin, dest) {
      const url = `https://router.project-osrm.org/route/v1/driving/${origin.lng},${origin.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson&steps=false`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.routes && data.routes.length > 0) {
        return data.routes[0];
      }
      return null;
    }

    async function planTrip() {
      const idxO = parseInt(document.getElementById('selectOrigin').value);
      const idxD = parseInt(document.getElementById('selectDest').value);

      if (idxO === idxD) {
        alert("El origen y el destino deben ser ciudades distintas.");
        return;
      }

      const origCity = ARGENTINA_CITIES[idxO];
      const destCity = ARGENTINA_CITIES[idxD];

      const maxKmDay = parseInt(document.getElementById('inputMaxKmDay').value) || 450;
      const safeAutonomy = calculateAutonomy();

      document.getElementById('resultsPanel').style.display = "none";
      markersLayer.clearLayers();
      if (routeLayer) map.removeLayer(routeLayer);

      const route = await getRoute(origCity, destCity);
      if (!route) {
        alert("No se pudo calcular una ruta por asfalto entre esas ciudades.");
        return;
      }

      // GeoJSON invierte coordenadas: [lng, lat] -> Leaflet necesita [lat, lng]
      const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
      const totalKm = Math.round(route.distance / 1000);
      const totalHours = (route.duration / 3600).toFixed(1);

      routeLayer = L.polyline(coords, {
        color: '#38bdf8',
        weight: 5,
        opacity: 0.85
      }).addTo(map);

      map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

      // Marcadores de origen y destino
      const iconO = L.divIcon({ className: '', html: '<div class="custom-icon marker-origin" style="width:26px;height:26px;">A</div>', iconSize: [26, 26], iconAnchor: [13, 13] });
      const iconD = L.divIcon({ className: '', html: '<div class="custom-icon marker-dest" style="width:26px;height:26px;">B</div>', iconSize: [26, 26], iconAnchor: [13, 13] });

      L.marker([origCity.lat, origCity.lng], { icon: iconO }).addTo(markersLayer).bindPopup(`<b>Origen:</b> ${origCity.name}`);
      L.marker([destCity.lat, destCity.lng], { icon: iconD }).addTo(markersLayer).bindPopup(`<b>Destino:</b> ${destCity.name}`);

      // Partición en días y pausas de 100 km
      const daysCount = Math.max(1, Math.ceil(totalKm / maxKmDay));
      const stages = [];
      const ptsCount = coords.length;

      for (let d = 1; d <= daysCount; d++) {
        const startRatio = (d - 1) / daysCount;
        const endRatio = d / daysCount;
        
        const startIdx = Math.floor(startRatio * (ptsCount - 1));
        const endIdx = Math.floor(endRatio * (ptsCount - 1));
        const dayKm = Math.round(totalKm / daysCount);

        const restStopsCount = Math.floor(dayKm / 100);
        const stops = [];

        for (let s = 1; s <= restStopsCount; s++) {
          const stopRatio = startRatio + (s * 100 / totalKm);
          if (stopRatio < endRatio) {
            const stopIdx = Math.floor(stopRatio * (ptsCount - 1));
            const stopCoord = coords[stopIdx];
            stops.push({ km: s * 100, coords: stopCoord });

            const rIcon = L.divIcon({ className: '', html: '<div class="custom-icon marker-rest" style="width:20px;height:20px;">☕</div>', iconSize: [20, 20], iconAnchor: [10, 10] });
            L.marker(stopCoord, { icon: rIcon }).addTo(markersLayer).bindPopup(`<b>Día ${d}: Parada Técnica (${s * 100} km)</b><br>15-20 min de hidratación y estiramiento.`);
          }
        }

        stages.push({
          day: d,
          km: dayKm,
          startIdx: startIdx,
          endIdx: endIdx,
          stops: stops,
          exceedsAutonomy: dayKm > safeAutonomy
        });
      }

      // Renderizar listado de etapas
      const stagesList = document.getElementById('stagesList');
      stagesList.innerHTML = '';

      stages.forEach(st => {
        const card = document.createElement('div');
        card.className = `day-card ${st.exceedsAutonomy ? 'caution-card' : ''}`;
        
        let chipsHtml = st.stops.map(s => `<span class="chip-stop">☕ Posta ${s.km} km</span>`).join('');
        if (st.exceedsAutonomy) {
          chipsHtml += `<span class="chip-stop fuel">⚠️ Cargar Nafta Intermedia</span>`;
        }

        card.innerHTML = `
          <div class="day-header">
            <span class="day-title">Jornada ${st.day}</span>
            <span class="day-km-tag ${st.km > maxKmDay ? 'warn' : ''}">${st.km} km</span>
          </div>
          <div class="stop-chips">${chipsHtml || '<span class="chip-stop">Tramo directo</span>'}</div>
        `;

        card.onclick = () => {
          document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          const daySlice = coords.slice(st.startIdx, st.endIdx + 1);
          if (daySlice.length > 1) {
            map.fitBounds(L.polyline(daySlice).getBounds(), { padding: [40, 40] });
          }
          if (window.innerWidth <= 768) switchMobileView('map');
        };

        stagesList.appendChild(card);
      });

      document.getElementById('tripTotals').innerText = `Total: ${totalKm} km en ${daysCount} día(s) (~${totalHours} h marcha)`;
      document.getElementById('resultsPanel').style.display = "flex";

      if (window.innerWidth <= 768) switchMobileView('list');
    }

    function switchMobileView(v) {
      const sidebar = document.getElementById('sidebar');
      const tabMap = document.getElementById('tabMapBtn');
      const tabList = document.getElementById('tabListBtn');

      if (v === 'map') {
        sidebar.classList.add('hidden-mobile');
        tabMap.classList.add('active');
        tabList.classList.remove('active');
        setTimeout(() => map.invalidateSize(), 300);
      } else {
        sidebar.classList.remove('hidden-mobile');
        tabMap.classList.remove('active');
        tabList.classList.add('active');
      }
    }

    window.addEventListener('resize', () => map.invalidateSize());

    // Inicializar datos y trazar la primera ruta al cargar
    populateCitySelectors();
    calculateAutonomy();
    planTrip();
  </script>
</body>
</html>
