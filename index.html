<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Ruta Moto Patagonia - Rafael Pirela</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-main: #0b1120;
      --bg-surface: #1e293b;
      --bg-card: #182234;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-main);
      color: #f8fafc;
    }

    /* BARRA LATERAL (Desktop) */
    #sidebar {
      width: 420px;
      min-width: 360px;
      height: 100%;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      z-index: 1000;
      transition: transform 0.3s ease;
    }

    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #0f172a;
    }

    /* HEADER */
    .header {
      padding: 16px;
      background: var(--bg-main);
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header p {
      font-size: 0.76rem;
      color: #94a3b8;
      margin-top: 3px;
    }

    /* CALCULADORA DE AUTONOMÍA */
    .calc-card {
      margin: 12px 14px 6px 14px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .calc-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .calc-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .calc-field label {
      display: block;
      font-size: 0.68rem;
      color: #94a3b8;
      margin-bottom: 3px;
    }
    .calc-field input {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
    }
    .calc-field input:focus {
      border-color: var(--accent);
    }
    .calc-result {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #334155;
      font-size: 0.72rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .calc-result strong {
      color: var(--success);
      font-size: 0.85rem;
    }

    /* ACCIONES RÁPIDAS */
    .actions-bar {
      display: flex;
      gap: 6px;
      padding: 6px 14px 10px 14px;
    }
    .btn {
      flex: 1;
      padding: 8px 10px;
      background: #334155;
      border: none;
      color: #f8fafc;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
    }
    .btn:hover { background: #475569; }
    .btn-primary { background: #0284c7; }
    .btn-primary:hover { background: #0369a1; }
    .btn-fuel.active { background: #ea580c; }

    /* LISTA DE DÍAS */
    .days-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 14px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .day-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      position: relative;
    }
    .day-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .day-card.active {
      border-color: var(--accent);
      background: #1c2e4a;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4);
    }
    .day-card.danger {
      border-color: var(--danger) !important;
      background: rgba(239, 68, 68, 0.15) !important;
    }
    .day-badge-danger {
      display: none;
      font-size: 0.65rem;
      font-weight: 800;
      background: var(--danger);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .day-card.danger .day-badge-danger {
      display: inline-block;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .day-date {
      font-size: 0.8rem;
      font-weight: 700;
      color: #93c5fd;
    }
    .day-km {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: #064e3b;
      color: #6ee7b7;
    }
    .day-km.danger {
      background: #7f1d1d;
      color: #fca5a5;
    }
    .day-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    .day-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.72rem;
      color: #94a3b8;
      border-top: 1px solid rgba(51, 65, 85, 0.6);
      padding-top: 6px;
    }

    /* ÍCONOS DE MAPA PERSONALIZADOS */
    .fuel-marker {
      background: #ea580c;
      border: 2px solid #ffffff;
      border-radius: 50%;
      color: white;
      text-align: center;
      line-height: 24px;
      font-size: 13px;
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
    }
    .fuel-marker.critical {
      background: #dc2626;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.8); }
      70% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }

    /* BARRA DE NAVEGACIÓN INFERIOR (Solo Celular) */
    .mobile-tab-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: #0b1120;
      border-top: 1px solid var(--border);
      z-index: 2000;
      grid-template-columns: 1fr 1fr;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
    }
    .tab-btn.active {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    /* RESPONSIVE DESIGN (Pantallas menores a 768px) */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .mobile-tab-bar {
        display: grid;
      }
      #sidebar {
        width: 100%;
        min-width: 100%;
        height: calc(100dvh - 54px);
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1500;
        border-right: none;
      }
      #sidebar.hidden-mobile {
        transform: translateY(100%);
        pointer-events: none;
      }
      #map-container {
        height: calc(100dvh - 54px);
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA LATERAL -->
  <div id="sidebar">
    <div class="header">
      <h1>🏍️ Circuito Patagónico</h1>
      <p>Buenos Aires ➔ Las Grutas ➔ Bariloche ➔ CABA</p>
    </div>

    <!-- CALCULADORA DE AUTONOMÍA -->
    <div class="calc-card">
      <div class="calc-title">⚙️ Autonomía de tu Moto</div>
      <div class="calc-inputs">
        <div class="calc-field">
          <label for="tankLiters">Tanque (Litros)</label>
          <input type="number" id="tankLiters" value="16" min="5" max="45" step="0.5" oninput="updateAutonomy()" />
        </div>
        <div class="calc-field">
          <label for="kmPerLiter">Consumo (km / L)</label>
          <input type="number" id="kmPerLiter" value="20" min="5" max="40" step="0.5" oninput="updateAutonomy()" />
        </div>
      </div>
      <div class="calc-result">
        <span>Autonomía segura (-10% reserva):</span>
        <strong id="autonomyDisplay">~288 km</strong>
      </div>
    </div>

    <!-- BOTONERA DE ACCIÓN -->
    <div class="actions-bar">
      <button class="btn btn-fuel active" id="btnToggleFuel" onclick="toggleFuelLayer()">⛽ Nafta (ON)</button>
      <button class="btn btn-primary" onclick="exportGPX()">📥 Bajar GPX</button>
      <button class="btn" onclick="resetView()">🔄 Total</button>
    </div>

    <!-- LISTA DE ETAPAS -->
    <div class="days-list" id="daysList"></div>
  </div>

  <!-- MAPA PRINCIPAL -->
  <div id="map-container">
    <div id="map"></div>
  </div>

  <!-- BOTONES INFERIORES EN CELULAR -->
  <div class="mobile-tab-bar">
    <button class="tab-btn" id="tabMapBtn" onclick="switchMobileView('map')">
      🗺️ Ver Mapa
    </button>
    <button class="tab-btn active" id="tabListBtn" onclick="switchMobileView('list')">
      📋 Itinerario / Ficha
    </button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const stages = [
      { day: 1, date: "Jue 1 Ene", name: "CABA ➔ Olavarría", routeInfo: "RN 3 y RP 51", surface: "Asfalto", color: "#38bdf8", points: [[-34.6037, -58.3816], [-35.4385, -58.8058], [-36.0157, -59.0975], [-36.8927, -60.3225]] },
      { day: 2, date: "Vie 2 Ene", name: "Olavarría ➔ Médanos", routeInfo: "RN 3 y RN 22", surface: "Asfalto", color: "#38bdf8", points: [[-36.8927, -60.3225], [-38.3756, -60.2798], [-38.7196, -62.2724], [-38.8267, -62.6936]] },
      { day: 3, date: "Sáb 3 Ene", name: "Médanos ➔ Las Grutas", routeInfo: "RN 3 Sur", surface: "Asfalto", color: "#38bdf8", points: [[-38.8267, -62.6936], [-40.8037, -62.9967], [-40.8094, -65.0931]] },
      { day: 5, date: "Lun 5 Ene", name: "Las Grutas ➔ Los Menucos", routeInfo: "RN 23 (Estepa)", surface: "Asfalto", color: "#f59e0b", points: [[-40.8094, -65.0931], [-40.7107, -66.1558], [-40.6657, -67.7552], [-40.8443, -68.1465]] },
      { day: 6, date: "Mar 6 Ene", name: "Los Menucos ➔ Bariloche", routeInfo: "RN 23 (Precaución obras)", surface: "Asfalto / Desvíos", color: "#f59e0b", points: [[-40.8443, -68.1465], [-41.3283, -69.5894], [-41.0333, -70.2667], [-41.1335, -71.3103]] },
      { day: 9, date: "Vie 9 Ene", name: "Bariloche ➔ Neuquén", routeInfo: "RN 237 (Valle Encantado)", surface: "Asfalto", color: "#10b981", points: [[-41.1335, -71.3103], [-40.0461, -70.0768], [-39.2625, -68.7842], [-38.9516, -68.0591]] },
      { day: 10, date: "Sáb 10 Ene", name: "Neuquén ➔ General Acha", routeInfo: "RN 151 y RP 20 (Desierto)", surface: "Asfalto", color: "#10b981", points: [[-38.9516, -68.0591], [-37.7719, -67.7161], [-37.5833, -66.6500], [-37.3770, -64.6043]] },
      { day: 11, date: "Dom 11 Ene", name: "General Acha ➔ CABA", routeInfo: "RN 5 Centro Pampeano", surface: "Asfalto", color: "#10b981", points: [[-37.3770, -64.6043], [-36.6204, -64.2906], [-35.9750, -62.7347], [-34.6037, -58.3816]] }
    ];

    const fuelStations = [
      { name: "YPF Valcheta", corridor: "RN 23", coords: [-40.7107, -66.1558], mandatory: true, alert: "Carga preventiva entrando a la RN 23." },
      { name: "YPF Ramos Mexía", corridor: "RN 23", coords: [-40.5756, -67.2478], mandatory: false, alert: "Posta intermedia en la estepa." },
      { name: "YPF Los Menucos", corridor: "RN 23", coords: [-40.8443, -68.1465], mandatory: true, alert: "Noche de posta. Llenar tanque al arribar." },
      { name: "YPF Ing. Jacobacci", corridor: "RN 23", coords: [-41.3283, -69.5894], mandatory: true, alert: "Última estación antes del tramo de obras a Bariloche." },
      { name: "Comallo (Puesto)", corridor: "RN 23", coords: [-41.0333, -70.2667], mandatory: false, alert: "Punto de emergencia si escasea nafta." },
      { name: "YPF Piedra del Águila", corridor: "RN 237", coords: [-40.0461, -70.0768], mandatory: true, alert: "Punto neurálgico Bariloche - Neuquén." },
      { name: "YPF Villa El Chocón", corridor: "RN 237", coords: [-39.2625, -68.7842], mandatory: false, alert: "Carga previa al Gran Neuquén." },
      { name: "YPF Catriel", corridor: "RN 151", coords: [-37.8767, -67.7947], mandatory: false, alert: "Límite Río Negro / La Pampa." },
      { name: "YPF / Shell 25 de Mayo", corridor: "RP 20", coords: [-37.7719, -67.7161], mandatory: true, alert: "CARGA OBLIGATORIA: Inicio de la Ruta del Desierto." },
      { name: "Pampa Petrol Chacharramendi", corridor: "RP 20", coords: [-37.5833, -66.6500], mandatory: true, alert: "CARGA OBLIGATORIA: Oasis a mitad del desierto." },
      { name: "YPF General Acha", corridor: "RN 152", coords: [-37.3770, -64.6043], mandatory: true, alert: "Fin de la travesía del desierto." }
    ];

    // INICIALIZACIÓN LEAFLET
    const map = L.map('map', { zoomControl: false }).setView([-39.0, -65.0], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 18
    }).addTo(map);

    let polylineLayers = [];
    let fuelGroup = L.layerGroup().addTo(map);
    let allPoints = [];
    let fuelVisible = true;

    function renderFuel() {
      fuelStations.forEach(s => {
        const icon = L.divIcon({
          className: '',
          html: `<div class="fuel-marker ${s.mandatory ? 'critical' : ''}" style="width:24px;height:24px;">⛽</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });
        const m = L.marker(s.coords, { icon: icon }).bindPopup(`
          <div style="font-size:12px;color:#f8fafc;padding:2px;">
            <strong style="color:${s.mandatory ? '#ef4444' : '#fbbf24'};">${s.mandatory ? '🚨 OBLIGATORIO' : 'ℹ️ POSTA'}</strong><br>
            <b>${s.name}</b> (${s.corridor})<br>
            <span style="color:#94a3b8;">${s.alert}</span>
          </div>
        `);
        fuelGroup.addLayer(m);
      });
    }

    async function fetchRealRoute(coords) {
      const coordStr = coords.map(c => `${c[1]},${c[0]}`).join(';');
      const url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          const r = data.routes[0];
          return {
            latLngs: r.geometry.coordinates.map(c => [c[1], c[0]]),
            km: Math.round(r.distance / 1000),
            hours: (r.duration / 3600).toFixed(1)
          };
        }
      } catch (e) {
        console.warn("Fallo OSRM:", e);
      }
      return { latLngs: coords, km: 350, hours: "4.5" };
    }

    function getSafeRange() {
      const tank = parseFloat(document.getElementById('tankLiters').value) || 16;
      const kml = parseFloat(document.getElementById('kmPerLiter').value) || 20;
      return Math.round((tank * kml) * 0.90);
    }

    function updateAutonomy() {
      const range = getSafeRange();
      document.getElementById('autonomyDisplay').innerText = `~${range} km`;

      stages.forEach(s => {
        const card = document.getElementById(`card-${s.day}`);
        const kmEl = document.getElementById(`km-${s.day}`);
        const p = polylineLayers.find(pl => pl.day === s.day);
        const exceeds = s.distanceKm > range;

        if (card && kmEl) {
          if (exceeds) {
            card.classList.add('danger');
            kmEl.classList.add('danger');
            kmEl.innerText = `${s.distanceKm} km (+${s.distanceKm - range} km)`;
          } else {
            card.classList.remove('danger');
            kmEl.classList.remove('danger');
            kmEl.innerText = `${s.distanceKm} km`;
          }
        }
        if (p && p.line) {
          p.line.setStyle({
            color: exceeds ? '#ef4444' : s.color,
            dashArray: exceeds ? '6, 6' : null
          });
        }
      });
    }

    async function init() {
      renderFuel();
      const list = document.getElementById('daysList');

      for (const s of stages) {
        const routeData = await fetchRealRoute(s.points);
        s.latLngs = routeData.latLngs;
        s.distanceKm = routeData.km;
        s.durationHours = routeData.hours;

        const line = L.polyline(routeData.latLngs, {
          color: s.color,
          weight: 4,
          opacity: 0.85
        }).addTo(map);

        polylineLayers.push({ day: s.day, line: line, bounds: line.getBounds() });
        allPoints.push(...s.points);

        const card = document.createElement('div');
        card.className = 'day-card';
        card.id = `card-${s.day}`;
        card.innerHTML = `
          <div class="day-header">
            <span class="day-date">Día ${s.day} • ${s.date}</span>
            <span class="day-badge-danger">SUPERA AUTONOMÍA</span>
            <span class="day-km" id="km-${s.day}">${s.distanceKm} km</span>
          </div>
          <div class="day-title">${s.name}</div>
          <div class="day-meta">
            <span>⏱️ ~${s.durationHours} h</span>
            <span>🛣️ ${s.surface}</span>
            <span>📍 ${s.routeInfo}</span>
          </div>
        `;
        card.onclick = () => focusDay(s.day);
        list.appendChild(card);
      }

      updateAutonomy();
      map.invalidateSize();
    }

    function focusDay(day) {
      document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
      const c = document.getElementById(`card-${day}`);
      if (c) c.classList.add('active');

      const safe = getSafeRange();
      polylineLayers.forEach(p => {
        const s = stages.find(st => st.day === p.day);
        const exceeds = s.distanceKm > safe;
        if (p.day === day) {
          p.line.setStyle({ weight: 7, opacity: 1 });
          p.line.bringToFront();
          map.fitBounds(p.bounds, { padding: [40, 40] });
        } else {
          p.line.setStyle({ weight: 3, opacity: 0.3, color: exceeds ? '#ef4444' : s.color });
        }
      });

      // Si está en celular, cambiar la vista al mapa automáticamente al elegir un tramo
      if (window.innerWidth <= 768) {
        switchMobileView('map');
      }
    }

    function resetView() {
      map.fitBounds(L.latLngBounds(allPoints), { padding: [30, 30] });
      updateAutonomy();
      document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
    }

    function toggleFuelLayer() {
      const btn = document.getElementById('btnToggleFuel');
      if (fuelVisible) {
        map.removeLayer(fuelGroup);
        btn.classList.remove('active');
        btn.innerText = "⛽ Nafta (OFF)";
      } else {
        map.addLayer(fuelGroup);
        btn.classList.add('active');
        btn.innerText = "⛽ Nafta (ON)";
      }
      fuelVisible = !fuelVisible;
    }

    function switchMobileView(view) {
      const sidebar = document.getElementById('sidebar');
      const tabMap = document.getElementById('tabMapBtn');
      const tabList = document.getElementById('tabListBtn');

      if (view === 'map') {
        sidebar.classList.add('hidden-mobile');
        tabMap.classList.add('active');
        tabList.classList.remove('active');
        setTimeout(() => map.invalidateSize(), 300);
      } else {
        sidebar.classList.remove('hidden-mobile');
        tabMap.classList.remove('active');
        tabList.classList.add('active');
      }
    }

    function exportGPX() {
      let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="RutaPatagonia" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>Circuito Patagonico</name></metadata>`;
      fuelStations.forEach(s => {
        gpx += `\n<wpt lat="${s.coords[0]}" lon="${s.coords[1]}"><name>GAS: ${s.name}</name><desc>${s.alert}</desc></wpt>`;
      });
      stages.forEach(s => {
        if (s.latLngs) {
          gpx += `\n<trk><name>Día ${s.day}: ${s.name}</name><trkseg>`;
          s.latLngs.forEach(c => { gpx += `\n  <trkpt lat="${c[0]}" lon="${c[1]}"></trkpt>`; });
          gpx += `\n</trkseg></trk>`;
        }
      });
      gpx += `\n</gpx>`;
      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ruta_patagonia_completa.gpx';
      a.click();
    }

    window.addEventListener('resize', () => map.invalidateSize());
    init();
  </script>
</body>
